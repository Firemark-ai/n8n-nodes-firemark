# Publishes the package to npm when a version tag (e.g. 0.1.0) is pushed.
#
# n8n requires community nodes to be published from GitHub Actions with an npm
# provenance statement (required for all community nodes since 1 May 2026).
# This workflow uses npm Trusted Publishing: GitHub's OIDC token authenticates
# to npm, so no NPM_TOKEN secret is stored in the repository.
#
# One-time setup on npmjs.com (package settings, "Trusted Publisher"):
#   Publisher:        GitHub Actions
#   Organization:     Firemark-ai
#   Repository:       n8n-nodes-firemark
#   Workflow:         publish.yml
#   Environment:      (blank)
# The package must exist on npm before a Trusted Publisher can be added, so the
# first version may need a one-off manual publish; see README "Releasing".
#
# Release: `npm run release` lints, builds, bumps the version, updates the
# changelog, commits, tags and pushes; the tag triggers this workflow.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token for Trusted Publishing and the provenance statement.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted Publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check requests against the OpenAPI spec
        run: |
          npm run build
          npm test

      # In GitHub Actions, `n8n-node release` lints, builds and runs
      # `npm publish` with NPM_CONFIG_PROVENANCE=true. No token: npm exchanges
      # the OIDC token through the Trusted Publisher.
      - name: Publish with provenance
        run: npm run release
